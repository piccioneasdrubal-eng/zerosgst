<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento ZeroLegend</title><style>body{margin:0;background:#07101b;color:#eef6ff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(560px,92vw);background:#101c2b;border:1px solid #2b425c;border-radius:20px;padding:32px;box-shadow:0 25px 80px #0008;text-align:center}.ok{font-size:48px}.muted{color:#9eb2c8}a{color:#58dbff}</style></head><body><main class="box"><div class="ok">✅</div><h1>Pagamento ricevuto</h1><p id="status" class="muted">Sto verificando l'accredito degli ZeroCoins…</p><p><a href="/">Torna al portale</a></p></main><script src="auth.js"></script><script>(async()=>{const status=document.getElementById('status');const token=window.ZLAuth?.getToken?.()||localStorage.getItem('zl_auth_token')||'';const sid=new URLSearchParams(location.search).get('session_id')||'';if(!token||!sid){status.textContent='Pagamento completato, ma sessione non disponibile. Torna al portale e accedi.';return;}for(let i=0;i<12;i++){try{const r=await fetch('/payments/status.php?session_id='+encodeURIComponent(sid)+'&token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(d.ok&&d.order?.status==='paid'){status.textContent='✅ ZeroCoins accreditati. Saldo attuale: '+Number(d.coins||0).toLocaleString('it-IT')+' ZC';window.location.href='/?payment=success';return;} }catch(e){} await new Promise(r=>setTimeout(r,1500));}status.textContent='Pagamento ricevuto. L’accredito potrebbe richiedere alcuni secondi; torna al portale per aggiornare il saldo.';})();</script></body></html>
