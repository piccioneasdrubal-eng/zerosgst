<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Cell Arena 3.0</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050b14;
  color:white;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  z-index:10;
  left:14px;
  top:14px;

  min-width:210px;

  padding:13px 15px;

  border-radius:15px;

  background:#081322dd;
  border:1px solid #ffffff12;

  backdrop-filter:blur(12px);

  box-shadow:
    0 15px 50px #0008;
}

#mass{
  font-size:19px;
  font-weight:bold;
}

.small{
  color:#8d9bb0;
  font-size:11px;
}

.bar{
  height:7px;
  margin-top:7px;

  overflow:hidden;

  background:#ffffff12;
  border-radius:10px;
}

.bar i{
  display:block;
  width:0;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #42d392,
      #55a7ff
    );

  transition:
    width .15s linear;
}

/* =========================================================
   LEADERBOARD
========================================================= */

#board{
  position:fixed;
  z-index:10;

  right:14px;
  top:14px;

  width:220px;

  padding:14px;

  background:#081322dd;
  border:1px solid #ffffff12;

  border-radius:15px;

  backdrop-filter:blur(12px);
}

#board h3{
  margin:0 0 10px;
}

.row{
  display:flex;
  justify-content:space-between;

  padding:4px 0;

  font-size:12px;
}

/* =========================================================
   CONNECTION
========================================================= */

#connection{
  position:fixed;
  z-index:50;

  left:50%;
  top:10px;

  transform:translateX(-50%);

  padding:7px 13px;

  border-radius:20px;

  background:#111b29ee;

  font-size:11px;

  pointer-events:none;
}

/* =========================================================
   POWER
========================================================= */

#power{
  position:fixed;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  z-index:10;

  display:flex;
  gap:6px;
}

.power{
  padding:8px 12px;

  border-radius:10px;

  background:#ffffff12;

  font-size:12px;
}

/* =========================================================
   MINIMAP
========================================================= */

#mini{
  position:fixed;

  right:14px;
  bottom:14px;

  z-index:10;

  width:160px;
  height:160px;

  border-radius:12px;

  border:2px solid #ffffff22;

  background:#07101d;
}

/* =========================================================
   MISSION
========================================================= */

#mission{
  position:fixed;

  left:14px;
  bottom:14px;

  z-index:10;

  padding:10px 13px;

  background:#081322dd;

  border-radius:12px;

  font-size:12px;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
  position:fixed;

  left:14px;
  bottom:85px;

  z-index:20;

  width:350px;
  height:300px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:#07101dea;

  border:1px solid #ffffff12;

  border-radius:16px;

  box-shadow:
    0 20px 70px #0009;

  backdrop-filter:blur(12px);
}

#chatHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:11px 12px;

  background:#0d1b2e;

  border-bottom:1px solid #ffffff0d;

  font-size:13px;
  font-weight:bold;
}

#chatOnline{
  color:#42d392;
  font-size:10px;
}

#chatMessages{
  flex:1;

  overflow-y:auto;

  padding:10px;
}

.chatMessage{
  margin-bottom:9px;

  font-size:12px;

  line-height:1.35;

  word-break:break-word;
}

.chatName{
  font-weight:bold;
}

.chatTime{
  color:#607089;
  font-size:9px;
  margin-left:5px;
}

.chatText{
  color:#dce5f2;
}

#chatInputArea{
  display:flex;
  gap:5px;

  padding:7px;

  border-top:1px solid #ffffff0d;
}

#chatInput{
  flex:1;
  min-width:0;

  margin:0;

  padding:9px;

  border:1px solid #ffffff12;
  border-radius:9px;

  background:#111f34;
  color:white;
}

#chatSend{
  width:auto;

  padding:8px 13px;

  border-radius:9px;

  background:#42d392;
}

#chatOpen{
  position:fixed;

  left:14px;
  bottom:14px;

  z-index:19;

  padding:10px 14px;

  border-radius:11px;

  background:#0c1728ee;

  color:white;
}

/* =========================================================
   USER
========================================================= */

#userButton{
  position:fixed;

  right:250px;
  top:14px;

  z-index:20;

  padding:9px 13px;

  border-radius:11px;

  background:#081322ee;

  color:white;
}

#userMenu{
  position:fixed;

  right:250px;
  top:60px;

  z-index:30;

  width:250px;

  padding:16px;

  border-radius:16px;

  background:#0c1728f5;

  box-shadow:
    0 20px 60px #0009;
}

#userMenu h3{
  margin:0 0 12px;
}

/* =========================================================
   MENUS
========================================================= */

#menu,
#pause,
#over{
  position:fixed;

  inset:0;

  z-index:40;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #162642dd,
      #02050bf5
    );
}

.card{
  width:min(450px,92vw);

  padding:30px;

  border-radius:22px;

  background:#0c1728f5;

  border:1px solid #ffffff14;

  box-shadow:
    0 25px 90px #000;
}

h1{
  margin:0 0 8px;

  font-size:40px;
}

h2{
  margin-top:0;
}

p{
  color:#aebbd0;
}

input,
select{
  width:100%;

  padding:11px;

  margin:5px 0 12px;

  border:1px solid #ffffff18;

  border-radius:10px;

  background:#111f34;

  color:white;
}

.card button{
  width:100%;

  padding:13px;

  margin-top:8px;

  border-radius:12px;

  background:#42d392;

  color:#06130d;

  font-weight:bold;
}

.card button.alt{
  background:#ffffff12;
  color:white;
}

@media(max-width:700px){

  #board{
    width:175px;
    top:65px;
  }

  #userButton{
    right:14px;
  }

  #userMenu{
    right:14px;
  }

  #chat{
    width:
      calc(100vw - 28px);

    height:260px;
  }

  #mission{
    display:none;
  }

  #mini{
    width:100px;
    height:100px;
  }
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="connection">
  🔴 Disconnesso
</div>

<!-- HUD -->

<div id="hud">

  <div id="mass">
    Massa: 25
  </div>

  <div>
    Livello
    <span id="level">1</span>
    · XP
    <span id="xp">0</span>
  </div>

  <div class="bar">
    <i id="xpbar"></i>
  </div>

  <div class="small">
    ⚡ Energia:
    <span id="energy">100</span>%
  </div>

</div>

<!-- LEADERBOARD -->

<div id="board">

  <h3>
    🏆 Classifica
  </h3>

  <div id="rows"></div>

</div>

<!-- MINIMAP -->

<canvas
  id="mini"
  width="160"
  height="160"
></canvas>

<!-- MISSION -->

<div id="mission">

  🎯
  <b>Missione</b>

  <br>

  Raccogli 30 particelle

  <br>

  <span id="missionCount">
    0
  </span>
  /30

</div>

<!-- POWER -->

<div id="power"></div>

<!-- USER -->

<button id="userButton">
  👤
  <span id="userNameButton">
    Player
  </span>
</button>

<div
  id="userMenu"
  class="hidden"
>

  <h3>
    👤 Profilo
  </h3>

  <label>
    Nickname
  </label>

  <input
    id="userNameInput"
    maxlength="16"
    value="Player"
  >

  <button id="saveName">
    💾 Salva
  </button>

  <button
    class="alt"
    id="closeUser"
  >
    Chiudi
  </button>

</div>

<!-- CHAT -->

<div id="chat">

  <div id="chatHeader">

    <span>
      💬 Chat globale

      <span id="chatOnline">
        ● 0 online
      </span>
    </span>

    <button
      id="chatClose"
      class="alt"
    >
      −
    </button>

  </div>

  <div id="chatMessages"></div>

  <div id="chatInputArea">

    <input
      id="chatInput"
      maxlength="180"
      autocomplete="off"
      placeholder="Scrivi un messaggio..."
    >

    <button id="chatSend">
      ➤
    </button>

  </div>

</div>

<button
  id="chatOpen"
  class="hidden"
>
  💬 Chat
</button>

<!-- MENU -->

<div id="menu">

  <div class="card">

    <h1>
      🟢 Cell Arena
    </h1>

    <p>
      Multiplayer arcade.
      Muoviti, raccogli massa,
      dividi la cellula e
      sconfiggi gli altri giocatori.
    </p>

    <label>
      Nome
    </label>

    <input
      id="name"
      maxlength="16"
      value="Player"
    >

    <label>
      Modalità
    </label>

    <select id="mode">

      <option value="classic">
        Classic
      </option>

      <option value="survival">
        Survival
      </option>

      <option value="chaos">
        Chaos
      </option>

    </select>

    <button id="play">
      GIOCA
    </button>

  </div>

</div>

<!-- PAUSE -->

<div
  id="pause"
  class="hidden"
>

  <div class="card">

    <h2>
      ⏸ Pausa
    </h2>

    <button id="resume">
      Continua
    </button>

    <button
      class="alt"
      onclick="location.reload()"
    >
      Menu
    </button>

  </div>

</div>

<!-- GAME OVER -->

<div
  id="over"
  class="hidden"
>

  <div class="card">

    <h2>
      💥 Game Over
    </h2>

    <p id="result"></p>

    <button
      onclick="location.reload()"
    >
      Rigioca
    </button>

  </div>

</div>

<script>

"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById(
    "game"
  );

const ctx =
  canvas.getContext("2d");

const mini =
  document.getElementById(
    "mini"
  );

const mctx =
  mini.getContext("2d");

let width = innerWidth;
let height = innerHeight;

function resize(){

  width = innerWidth;
  height = innerHeight;

  canvas.width =
    width *
    devicePixelRatio;

  canvas.height =
    height *
    devicePixelRatio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

addEventListener(
  "resize",
  resize
);

resize();

/* =========================================================
   STATE
========================================================= */

const WORLD = 6000;

let socket = null;

let myId = null;

let state = {
  world: WORLD,
  foods: [],
  players: []
};

let running = false;
let paused = false;

let mouse = {
  x: width / 2,
  y: height / 2
};

let camera = {
  x: WORLD / 2,
  y: WORLD / 2,
  zoom: 1
};

let particles = [];

let mission = 0;

let gameStart = 0;

let bestMass = 0;

/* =========================================================
   HELPERS
========================================================= */

function clamp(
  value,
  min,
  max
){
  return Math.max(
    min,
    Math.min(max,value)
  );
}

function distance(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function escapeHTML(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

/* =========================================================
   PLAYER
========================================================= */

function getMe(){

  return state.players.find(
    p => p.id === myId
  );
}

function getMainCell(){

  const me = getMe();

  if (
    !me ||
    !me.cells ||
    !me.cells.length
  ){
    return null;
  }

  return me.cells[0];
}

/* =========================================================
   CONNECTION
========================================================= */

function setConnection(
  text,
  color
){

  const el =
    document.getElementById(
      "connection"
    );

  el.textContent = text;
  el.style.color = color;
}

function connect(){

  if (
    socket &&
    (
      socket.readyState ===
      WebSocket.OPEN ||

      socket.readyState ===
      WebSocket.CONNECTING
    )
  ){
    return;
  }

  const protocol =
    location.protocol ===
    "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );

  socket.addEventListener(
    "open",
    () => {

      setConnection(
        "🟢 Connesso",
        "#42d392"
      );

      send({
        type:"join",
        name:
          document
            .getElementById(
              "name"
            )
            .value
      });
    }
  );

  socket.addEventListener(
    "message",
    event => {

      let message;

      try{
        message =
          JSON.parse(
            event.data
          );
      }catch{
        return;
      }

      handleMessage(
        message
      );
    }
  );

  socket.addEventListener(
    "close",
    () => {

      setConnection(
        "🔴 Disconnesso",
        "#ff6680"
      );

      if(running){

        setTimeout(
          connect,
          2500
        );
      }
    }
  );

  socket.addEventListener(
    "error",
    () => {

      setConnection(
        "🟠 Errore connessione",
        "#ffbf55"
      );
    }
  );
}

function send(data){

  if(
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify(data)
    );
  }
}

/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleMessage(msg){

  if(
    msg.type ===
    "welcome"
  ){

    myId = msg.id;

    return;
  }

  if(
    msg.type ===
    "state"
  ){

    state = msg;

    updateOnline();

    updateHUD();

    return;
  }

  if(
    msg.type ===
    "chatHistory"
  ){

    renderChat(
      msg.messages || []
    );

    return;
  }

  if(
    msg.type ===
    "chatMessage"
  ){

    addChat(
      msg.message
    );

    return;
  }

  if(
    msg.type ===
    "system"
  ){

    addChat({
      name:"Sistema",
      color:"#ffbf55",
      text:msg.text,
      time:""
    });

    return;
  }

  if(
    msg.type ===
    "levelUp"
  ){

    burst(
      camera.x,
      camera.y,
      "#ffe66d",
      30
    );

    return;
  }

  if(
    msg.type ===
    "nameChanged"
  ){

    return;
  }

  if(
    msg.type ===
    "dead"
  ){

    gameOver(
      msg.score,
      msg.level
    );

    return;
  }

  if(
    msg.type ===
    "error"
  ){

    addChat({
      name:"Sistema",
      color:"#ff6680",
      text:
        msg.message ||
        "Errore",
      time:""
    });
  }
}

/* =========================================================
   MOVEMENT
========================================================= */

function worldMouse(){

  return {
    x:
      camera.x +
      (
        mouse.x -
        width / 2
      ) /
      camera.zoom,

    y:
      camera.y +
      (
        mouse.y -
        height / 2
      ) /
      camera.zoom
  };
}

function sendMove(){

  if(
    !running ||
    paused
  ){
    return;
  }

  const target =
    worldMouse();

  send({
    type:"move",
    x:target.x,
    y:target.y
  });
}

addEventListener(
  "mousemove",
  event => {

    mouse.x =
      event.clientX;

    mouse.y =
      event.clientY;

    sendMove();
  }
);

addEventListener(
  "touchmove",
  event => {

    if(
      !event.touches[0]
    ){
      return;
    }

    mouse.x =
      event.touches[0].clientX;

    mouse.y =
      event.touches[0].clientY;

    sendMove();

  },
  {
    passive:true
  }
);

/* =========================================================
   ACTIONS
========================================================= */

function split(){

  if(
    !running ||
    paused
  ){
    return;
  }

  send({
    type:"split"
  });
}

function eject(){

  if(
    !running ||
    paused
  ){
    return;
  }

  send({
    type:"eject"
  });
}

addEventListener(
  "keydown",
  event => {

    if(
      event.target.tagName ===
      "INPUT"
    ){
      return;
    }

    if(
      event.code ===
      "Space"
    ){

      event.preventDefault();

      split();
    }

    if(
      event.code ===
      "KeyW"
    ){

      eject();
    }

    if(
      event.code ===
      "Escape"
    ){

      togglePause();
    }
  }
);

/* =========================================================
   PARTICLES
========================================================= */

function burst(
  x,
  y,
  color,
  count
){

  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({
      x,
      y,

      vx:
        Math.random()*6-3,

      vy:
        Math.random()*6-3,

      life:
        .4 +
        Math.random()*.8,

      color,

      size:
        1 +
        Math.random()*4
    });
  }
}

function updateParticles(){

  for(
    let i =
      particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vx *= .97;
    p.vy *= .97;

    p.life -= .016;

    if(
      p.life <= 0
    ){
      particles.splice(
        i,
        1
      );
    }
  }
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const cell =
    getMainCell();

  if(!cell){
    return;
  }

  camera.x +=
    (
      cell.x -
      camera.x
    ) * .10;

  camera.y +=
    (
      cell.y -
      camera.y
    ) * .10;

  const targetZoom =
    clamp(
      40 /
      Math.max(
        cell.r,
        1
      ),
      .45,
      1.15
    );

  camera.zoom +=
    (
      targetZoom -
      camera.zoom
    ) * .05;
}

function screen(
  x,
  y
){

  return {
    x:
      (
        x -
        camera.x
      ) *
      camera.zoom +
      width / 2,

    y:
      (
        y -
        camera.y
      ) *
      camera.zoom +
      height / 2
  };
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle =
    "#07101d";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  ctx.save();

  drawGrid();
  drawFood();
  drawPlayers();
  drawParticles();

  ctx.restore();

  drawMiniMap();
}

function drawGrid(){

  const left =
    camera.x -
    width /
    2 /
    camera.zoom;

  const top =
    camera.y -
    height /
    2 /
    camera.zoom;

  ctx.strokeStyle =
    "#ffffff08";

  ctx.lineWidth = 1;

  for(
    let x =
      Math.floor(
        left / 100
      ) * 100;

    x <
      left +
      width /
      camera.zoom +
      100;

    x += 100
  ){

    const p =
      screen(x,0);

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      0
    );

    ctx.lineTo(
      p.x,
      height
    );

    ctx.stroke();
  }

  for(
    let y =
      Math.floor(
        top / 100
      ) * 100;

    y <
      top +
      height /
      camera.zoom +
      100;

    y += 100
  ){

    const p =
      screen(0,y);

    ctx.beginPath();

    ctx.moveTo(
      0,
      p.y
    );

    ctx.lineTo(
      width,
      p.y
    );

    ctx.stroke();
  }

  const a =
    screen(0,0);

  const b =
    screen(
      WORLD,
      WORLD
    );

  ctx.strokeStyle =
    "#42d39266";

  ctx.lineWidth = 5;

  ctx.strokeRect(
    a.x,
    a.y,
    b.x-a.x,
    b.y-a.y
  );
}

function drawFood(){

  for(
    const food of
    state.foods
  ){

    const p =
      screen(
        food.x,
        food.y
      );

    const r =
      food.r *
      camera.zoom;

    if(
      p.x < -20 ||
      p.x > width+20 ||
      p.y < -20 ||
      p.y > height+20
    ){
      continue;
    }

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      food.color;

    ctx.fill();
  }
}

function drawPlayers(){

  const all=[];

  for(
    const player of
    state.players
  ){

    for(
      const cell of
      player.cells
    ){

      all.push({
        player,
        cell
      });
    }
  }

  all.sort(
    (a,b) =>
      a.cell.r -
      b.cell.r
  );

  for(
    const item of all
  ){

    const p =
      item.player;

    const cell =
      item.cell;

    const pos =
      screen(
        cell.x,
        cell.y
      );

    const r =
      cell.r *
      camera.zoom;

    ctx.beginPath();

    ctx.arc(
      pos.x,
      pos.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      p.color;

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      pos.x -
      r*.28,
      pos.y -
      r*.28,
      r*.34,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      "#ffffff22";

    ctx.fill();

    if(
      p.id === myId
    ){

      ctx.beginPath();

      ctx.arc(
        pos.x,
        pos.y,
        r+4,
        0,
        Math.PI*2
      );

      ctx.strokeStyle =
        "#ffffff55";

      ctx.lineWidth = 2;

      ctx.stroke();
    }

    if(
      r > 18
    ){

      ctx.fillStyle =
        "#fff";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.font =
        `bold ${
          Math.max(
            10,
            r*.24
          )
        }px Arial`;

      ctx.fillText(
        p.name,
        pos.x,
        pos.y
      );
    }
  }
}

function drawParticles(){

  for(
    const p of
    particles
  ){

    const pos =
      screen(
        p.x,
        p.y
      );

    ctx.globalAlpha =
      Math.max(
        0,
        p.life
      );

    ctx.beginPath();

    ctx.arc(
      pos.x,
      pos.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      p.color;

    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

/* =========================================================
   MINIMAP
========================================================= */

function drawMiniMap(){

  const size = 160;

  mctx.clearRect(
    0,
    0,
    size,
    size
  );

  mctx.fillStyle =
    "#07101d";

  mctx.fillRect(
    0,
    0,
    size,
    size
  );

  const scale =
    size / WORLD;

  for(
    const player of
    state.players
  ){

    for(
      const cell of
      player.cells
    ){

      mctx.fillStyle =
        player.id === myId
          ? "#fff"
          : player.color;

      mctx.beginPath();

      mctx.arc(
        cell.x * scale,
        cell.y * scale,
        player.id === myId
          ? 3
          : 2,
        0,
        Math.PI*2
      );

      mctx.fill();
    }
  }
}

/* =========================================================
   HUD
========================================================= */

function updateOnline(){

  document.getElementById(
    "chatOnline"
  ).textContent =
    `● ${state.players.length} online`;
}

function updateHUD(){

  const me =
    getMe();

  if(!me){
    return;
  }

  let mass = 0;

  for(
    const cell of
    me.cells
  ){
    mass +=
      cell.r *
      cell.r;
  }

  bestMass =
    Math.max(
      bestMass,
      mass
    );

  document.getElementById(
    "mass"
  ).textContent =
    `Massa: ${Math.floor(mass)}`;

  document.getElementById(
    "level"
  ).textContent =
    me.level;

  document.getElementById(
    "xp"
  ).textContent =
    me.xp;

  const xpMax =
    me.level *
    50;

  document.getElementById(
    "xpbar"
  ).style.width =
    clamp(
      me.xp /
      xpMax *
      100,
      0,
      100
    ) + "%";

  document.getElementById(
    "energy"
  ).textContent =
    me.energy;
}

/* =========================================================
   LEADERBOARD
========================================================= */

function updateLeaderboard(){

  const players =
    [...state.players];

  players.sort(
    (a,b) => {

      const massA =
        a.cells.reduce(
          (sum,c) =>
            sum+c.r*c.r,
          0
        );

      const massB =
        b.cells.reduce(
          (sum,c) =>
            sum+c.r*c.r,
          0
        );

      return massB-massA;
    }
  );

  const rows =
    players.slice(
      0,
      8
    );

  document.getElementById(
    "rows"
  ).innerHTML =
    rows.map(
      (p,index) => {

        const mass =
          p.cells.reduce(
            (sum,c) =>
              sum+c.r*c.r,
            0
          );

        return `
          <div
            class="row"
            style="
              color:${
                p.id === myId
                  ? "#42d392"
                  : "#fff"
              }
            "
          >
            <span>
              ${index+1}.
              ${escapeHTML(p.name)}
            </span>

            <span>
              ${Math.floor(mass)}
            </span>
          </div>
        `;
      }
    ).join("");
}

/* =========================================================
   CHAT
========================================================= */

function addChat(msg){

  const box =
    document.getElementById(
      "chatMessages"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "chatMessage";

  div.innerHTML = `
    <span
      class="chatName"
      style="color:${
        escapeHTML(
          msg.color ||
          "#42d392"
        )
      }"
    >
      ${escapeHTML(
        msg.name ||
        "Sistema"
      )}
    </span>

    <span class="chatTime">
      ${escapeHTML(
        msg.time || ""
      )}
    </span>

    <br>

    <span class="chatText">
      ${escapeHTML(
        msg.text || ""
      )}
    </span>
  `;

  box.appendChild(div);

  while(
    box.children.length >
    100
  ){

    box.removeChild(
      box.firstChild
    );
  }

  box.scrollTop =
    box.scrollHeight;
}

function renderChat(messages){

  const box =
    document.getElementById(
      "chatMessages"
    );

  box.innerHTML = "";

  for(
    const message of
    messages
  ){
    addChat(message);
  }
}

function sendChat(){

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value
      .replace(/\s+/g," ")
      .trim()
      .slice(0,180);

  if(!text){
    return;
  }

  send({
    type:"chat",
    text
  });

  input.value = "";
}

document.getElementById(
  "chatSend"
).onclick =
  sendChat;

document.getElementById(
  "chatInput"
).addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      sendChat();
    }

    event.stopPropagation();
  }
);

/* =========================================================
   USER MENU
========================================================= */

const userMenu =
  document.getElementById(
    "userMenu"
  );

document.getElementById(
  "userButton"
).onclick =
  () => {

    userMenu.classList.toggle(
      "hidden"
    );
  };

document.getElementById(
  "closeUser"
).onclick =
  () => {

    userMenu.classList.add(
      "hidden"
    );
  };

document.getElementById(
  "saveName"
).onclick =
  () => {

    const input =
      document.getElementById(
        "userNameInput"
      );

    const name =
      input.value
        .trim()
        .slice(0,16);

    if(!name){
      return;
    }

    document.getElementById(
      "name"
    ).value = name;

    document.getElementById(
      "userNameButton"
    ).textContent =
      name;

    send({
      type:"changeName",
      name
    });

    userMenu.classList.add(
      "hidden"
    );
  };

/* =========================================================
   CHAT OPEN/CLOSE
========================================================= */

document.getElementById(
  "chatClose"
).onclick =
  () => {

    document.getElementById(
      "chat"
    ).classList.add(
      "hidden"
    );

    document.getElementById(
      "chatOpen"
    ).classList.remove(
      "hidden"
    );
  };

document.getElementById(
  "chatOpen"
).onclick =
  () => {

    document.getElementById(
      "chat"
    ).classList.remove(
      "hidden"
    );

    document.getElementById(
      "chatOpen"
    ).classList.add(
      "hidden"
    );
  };

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  if(!running){
    return;
  }

  paused =
    !paused;

  document.getElementById(
    "pause"
  ).classList.toggle(
    "hidden",
    !paused
  );
}

document.getElementById(
  "resume"
).onclick =
  togglePause;

/* =========================================================
   GAME OVER
========================================================= */

function gameOver(
  score,
  level
){

  if(!running){
    return;
  }

  running = false;

  document.getElementById(
    "result"
  ).textContent =
    `Punteggio: ${
      Math.floor(
        score || 0
      )
    } · Livello: ${
      level || 1
    } · Record massa: ${
      Math.floor(bestMass)
    }`;

  document.getElementById(
    "over"
  ).classList.remove(
    "hidden"
  );
}

/* =========================================================
   START
========================================================= */

function start(){

  const name =
    document.getElementById(
      "name"
    ).value
    .trim()
    .slice(0,16)
    || "Player";

  document.getElementById(
    "userNameInput"
  ).value =
    name;

  document.getElementById(
    "userNameButton"
  ).textContent =
    name;

  document.getElementById(
    "menu"
  ).classList.add(
    "hidden"
  );

  running = true;

  gameStart =
    performance.now();

  connect();
}

document.getElementById(
  "play"
).onclick =
  start;

/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

  if(running){

    if(!paused){

      updateCamera();

      updateParticles();

      updateLeaderboard();
    }

    draw();
  }

  requestAnimationFrame(
    loop
  );
}

requestAnimationFrame(
  loop
);

/* =========================================================
   NAME SYNC
========================================================= */

document.getElementById(
  "name"
).addEventListener(
  "input",
  event => {

    const name =
      event.target.value
        .slice(0,16);

    document.getElementById(
      "userNameButton"
    ).textContent =
      name || "Player";

    document.getElementById(
      "userNameInput"
    ).value =
      name;
  }
);

</script>
