<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agar Server - Client</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
        }
        
        #gameCanvas {
            display: block;
        }

        /* --- Interfaccia Chat --- */
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            z-index: 10;
        }
        #chat-messages {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 14px;
            word-wrap: break-word;
        }
        #chat-input-container {
            display: flex;
            gap: 5px;
        }
        #chat-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
        }
        .exec-btn {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .exec-btn:hover {
            background: #45a049;
        }

        /* --- Menu Unificato (Tasto ESC) --- */
        #unified-menu {
            display: none; /* Nascosto di default */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #4CAF50;
            border-radius: 12px;
            width: 600px;
            height: 400px;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .menu-header {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #444;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .menu-content {
            display: flex;
            height: calc(100% - 55px);
        }
        .menu-sidebar {
            width: 30%;
            border-right: 1px solid #444;
            padding: 15px;
        }
        .menu-sidebar button {
            width: 100%;
            margin-bottom: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-sidebar button:hover {
            background: #444;
        }
        .menu-sidebar button.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .menu-panel {
            width: 70%;
            padding: 25px;
            display: none;
        }
        .menu-panel.active {
            display: block;
        }
        .menu-panel h3 {
            margin-top: 0;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <!-- Canvas Principale di Gioco -->
    <canvas id="gameCanvas"></canvas>

    <!-- Chat In-Game -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Scrivi in globale...">
            <button class="exec-btn" onclick="sendChat()">EXEC</button>
        </div>
    </div>

    <!-- Menu Unificato a 3 sezioni (Attivato con ESC) -->
    <div id="unified-menu">
        <div class="menu-header">Impostazioni di Gioco</div>
        <div class="menu-content">
            <!-- Sidebar Navigazione -->
            <div class="menu-sidebar">
                <button onclick="switchTab('profilo')" class="tab-btn active" id="btn-profilo">Profilo</button>
                <button onclick="switchTab('grafica')" class="tab-btn" id="btn-grafica">Grafica & Lag</button>
                <button onclick="switchTab('server')" class="tab-btn" id="btn-server">Stato Server</button>
            </div>
            
            <!-- Pannello 1: Profilo -->
            <div class="menu-panel active" id="panel-profilo">
                <h3>Profilo Giocatore</h3>
                <p>Inserisci il tuo nickname prima di spawnare.</p>
                <input type="text" placeholder="Nickname..." style="padding:8px; width:80%; background:#222; color:#fff; border:1px solid #555;">
                <br><br>
                <button class="exec-btn">Gioca</button>
            </div>
            
            <!-- Pannello 2: Grafica (Per aiutare con il lag) -->
            <div class="menu-panel" id="panel-grafica">
                <h3>Ottimizzazione</h3>
                <p>Disabilita gli effetti visivi extra se il gioco lagga.</p>
                <label><input type="checkbox" checked> Mostra Nomi</label><br><br>
                <label><input type="checkbox" checked> Mostra Massa</label><br><br>
                <label><input type="checkbox"> Grafica Bassa (Migliora FPS)</label>
            </div>
            
            <!-- Pannello 3: Server -->
            <div class="menu-panel" id="panel-server">
                <h3>Connessione</h3>
                <p>Host: wss://agar-server-bruo.onrender.com</p>
                <p id="ping-display">Ping: in calcolo...</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. GESTIONE MENU UNIFICATO (TASTO ESC)
        // ==========================================
        const unifiedMenu = document.getElementById('unified-menu');
        let isMenuOpen = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                isMenuOpen = !isMenuOpen;
                unifiedMenu.style.display = isMenuOpen ? 'block' : 'none';
            }
        });

        function switchTab(tabName) {
            // Rimuovi classe active da tutti i pannelli e bottoni
            document.querySelectorAll('.menu-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Aggiungi classe active a quello selezionato
            document.getElementById(`panel-${tabName}`).classList.add('active');
            document.getElementById(`btn-${tabName}`).classList.add('active');
        }

        // ==========================================
        // 2. CONNESSIONE WEBSOCKET E CHAT
        // ==========================================
        const socket = new WebSocket('wss://agar-server-bruo.onrender.com');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        function logSystemMessage(msg, color) {
            const sysMsg = document.createElement('div');
            sysMsg.style.color = color;
            sysMsg.style.fontWeight = 'bold';
            sysMsg.textContent = msg;
            chatMessages.appendChild(sysMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        socket.onopen = () => {
            logSystemMessage('[SYS] Connessione al server stabilita.', '#4CAF50');
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Gestione dei pacchetti Chat
            if (data.type === 'chat') {
                const messageDiv = document.createElement('div');
                messageDiv.textContent = `${data.sender || 'Anon'}: ${data.text}`;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Qui implementeremo: if (data.type === 'update') { ... aggiorna il canvas ... }
        };

        socket.onclose = () => {
            logSystemMessage('[SYS] Server disconnesso. Tentativo di riconnessione...', '#f44336');
        };

        function sendChat() {
            const text = chatInput.value.trim();
            if (text && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'chat', text: text }));
                chatInput.value = '';
            }
        }

        // Invia il messaggio anche premendo "Invio"
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendChat();
        });

        // ==========================================
        // 3. IMPOSTAZIONI CANVAS BASE
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize(); // Inizializza dimensioni

        // Loop di rendering a 60 FPS
        function draw() {
            // Svuota il frame precedente
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Disegna il background a griglia tipico di agar (opzionale)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // [Il rendering dei giocatori arriverà dai pacchetti del server qui]

            requestAnimationFrame(draw);
        }
        
        // Avvia il loop visivo
        draw();
    </script>
</body>
</html>
