<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrazione — ZeroLegend</title><link rel="stylesheet" href="/portal.css"></head><body><div class="grid"></div><main style="max-width:520px"><section class="auth-card glass" style="margin-top:10vh"><div class="auth-head"><div><div class="eyebrow">ZEROLEGEND</div><h2>Crea account</h2></div><a class="secondary-btn" href="/">Home</a></div><form id="registerForm" class="auth-form" style="grid-template-columns:1fr"><input id="regEmail" type="email" placeholder="Email" autocomplete="email" required><input id="regName" type="text" placeholder="Nickname" maxlength="40" required><input id="regPass" type="password" placeholder="Password (min. 8 caratteri)" autocomplete="new-password" required><button class="primary-btn" type="submit">Registrati</button><div id="regError" class="form-error"></div><div id="regSuccess" class="form-success"></div></form><p class="small">Hai già un account? <a href="/login.html">Accedi</a></p></section></main><script src="/game-config.js"></script><script src="/auth.js"></script></body></html>
