services:
  - type: web
    name: zerothelegend-websocket
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "1"
      - key: AUTH_VERIFY_URL
        value: https://zerothelegend.gamer.gd/auth/auth.php
      - key: ECONOMY_API_URL
        value: https://zerothelegend.gamer.gd/auth/economy.php
      - key: API_SECRET
        sync: false
      - key: ECONOMY_INTERNAL_SECRET
        sync: false
